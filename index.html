<!DOCTYPE html>
<html lang="en">
<head>
    <meta char  set="UTF-8">
    <title>Title</title>
</head>
<body>
      <div class="Calculator">
          <div class="DisplayShawty">
              <div id="Input">Input</div>
              <div id="Answer">Answer</div>
          </div>

          <div class="Numbers">
              <div class="button" onclick="give('1')">1</div>
              <div class="button" onclick="give('2')">2</div>
              <div class="button" onclick="give('3')">3</div>
              <div class="button" onclick="give('4')">4</div>
              <div class="button" onclick="give('5')">5</div>
              <div class="button" onclick="give('6')">6</div>
              <div class="button" onclick="give('7')">7</div>
              <div class="button" onclick="give('8')">8</div>
              <div class="button" onclick="give('9')">9</div>
              <div class="button" onclick="give('0')">0</div>
              <div class="button" onclick="give('.')">.</div>
          </div>
          <div class="Operators">
              <div class="button" onclick="give('+')">+</div>
              <div class="button" onclick="give('-')">-</div>
              <div class="button" onclick="give('*')">*</div>
              <div class="button" onclick="give('/')">/</div>
              <div class="button" onclick="give('%')">%</div>
              <div class="button" onclick="give('(')">(</div>
              <div class="button" onclick="give(')')">)</div>
              <div class="button" onclick="give('**')">**</div>
          </div>
          <div class="history">
              <div class="button" onclick="givePrevious()">Previous</div>
              <div class="button" onclick="giveCurrent()">CurrentShawty</div>
          </div>
          <div class="evaluation">
              <div class="button" onclick="giveEvaluation()">=</div>
              <div class="button" onclick="giveClear()">Reset</div>
          </div>
      </div>
</body>
</html>
