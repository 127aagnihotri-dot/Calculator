<!DOCTYPE html>
<html lang="en">
<head>
    <meta char  set="UTF-8">
    <title>Title</title>
</head>
<body>
      <div class="Calculator">
          <div class="DisplayShawty">
              <input id="Input">Input</input>
              <input id="Answer">Answer</input>
          </div>

          <div class="Top Row">
              <button class="button" onclick="give('1')">1</button>
              <button class="button" onclick="give('2')">2</button>
              <button class="button" onclick="give('3')">3</button>
          </div>
          <div class="Second row">
              <button class="button" onclick="give('4')">4</button>
              <button class="button" onclick="give('5')">5</button>
              <button class="button" onclick="give('6')">6</button>
          </div>
          <div class="bottom row">
              <button class="button" onclick="give('7')">7</button>
              <button class="button" onclick="give('8')">8</button>
              <button class="button" onclick="give('9')">9</button>
          </div >
          <div>
              <button class="button" onclick="give('0')">0</button>
              <button class="button" onclick="give('.')">.</button>
          </div>
          <div class="Operators">
              <button class="button" onclick="give('+')">+</button>
              <button class="button" onclick="give('-')">-</button>
              <button class="button" onclick="give('*')">*</button>
              <button class="button" onclick="give('/')">/</button>
              <button class="button" onclick="give('%')">%</button>
              <button class="button" onclick="give('(')">(</button>
              <button class="button" onclick="give(')')">)</button>
              <button class="button" onclick="give('**')">**</button>
          </div>
          <div class="history">
              <button class="button" onclick="givePrevious()">Previous</button>
              <button class="button" onclick="giveCurrent()">CurrentShawty</button>
          </div>
          <div class="evaluation">
              <button class="button" onclick="giveEvaluation()">=</button>
              <button class="button" onclick="giveClear()">Reset</button>
          </div>
      </div>
</body>
</html>
